name: Release

on:
  push:
    tags: ['v*']
  # Builds and uploads a signed APK without publishing anything, so the signing
  # setup can be checked before a tag is pushed.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          # See build.yml: AGP downloads the platform and build-tools it needs; this step
          # is here to accept the SDK licenses.
          packages: 'platform-tools'

      - name: Check the tag against versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::warning::Tag $GITHUB_REF_NAME does not match versionName '$declared' in app/build.gradle.kts. The APK will report $declared."
          fi

      - name: Decode the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret is set. The APK will be signed with the Android debug key, which cannot upgrade an install signed with a real release key."
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Assemble the release APK
        env:
          # Empty when there is no keystore, which makes the build fall back to the
          # debug signing config rather than fail.
          KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove the keystore
        if: ${{ always() && steps.keystore.outputs.signed == 'true' }}
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Stage the APK
        id: apk
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            version="${GITHUB_SHA::7}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          name="applang-${version}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist/${name}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo '### Verify the download'
            echo
            echo '```'
            echo "SHA-256  ${SHA256}"
            echo '```'
            if [ "$SIGNED" != 'true' ]; then
              echo
              echo '> [!WARNING]'
              echo '> This build was produced without a release keystore, so it is signed with the'
              echo '> Android debug key. Use it for testing only: it cannot upgrade an install'
              echo '> signed with a real release key.'
            fi
            echo
          } > "$notes"

          # A tag such as v1.05-beta1 is published as a pre-release.
          prerelease=''
          case "$GITHUB_REF_NAME" in *-*) prerelease='--prerelease' ;; esac

          # --generate-notes appends the commit/PR changelog after the notes above.
          gh release create "$GITHUB_REF_NAME" "dist/${APK}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --generate-notes \
            --verify-tag \
            $prerelease
