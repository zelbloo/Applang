name: Build

on:
  push:
    branches: ['**']
    # Changes that cannot affect the build output.
    paths-ignore:
      - '**.md'
      - 'other/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running build irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The project compiles against Java 21 (app/build.gradle.kts).
          java-version: '21'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only the default branch writes to the cache; other branches read it.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pinned so a runner image update cannot silently change what we build against.
          # Anything else AGP needs it downloads itself; this step accepts the licenses.
          packages: 'platforms;android-37 build-tools;36.0.0 platform-tools'

      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # After the uploads, so a lint regression still leaves you an installable APK.
      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload the lint report
        # Most useful precisely when the step above failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: warn
          retention-days: 14
